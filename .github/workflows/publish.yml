name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Successful CI run ID for the exact release source commit'
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: fde86bf96c6c280ec5b67b1ff2779f1bbbd795d7
  EXPECTED_VERSION: '0.1.2'

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify tag, version, and successful CI source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo 'Run on a release tag only'; exit 1; }
          [[ "$GITHUB_REF_NAME" == 'v0.1.2-publish2' ]] || { echo 'Unexpected publish tag'; exit 1; }
          test "$(git show "$EXPECTED_SOURCE_SHA:pyproject.toml" | grep -c 'version = "0.1.2"')" = 1
          git diff --exit-code "$EXPECTED_SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/publish.yml'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq .head_sha)" = "$EXPECTED_SOURCE_SHA"
          echo "source_sha=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download the six CI-tested wheels
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Build source distribution from original release commit
        run: |
          git checkout "$EXPECTED_SOURCE_SHA"
          python -m pip install --upgrade build
          python -m build --sdist -o dist
          find artifacts -name '*.whl' -exec cp '{}' dist/ \;
      - name: Validate all distributions before publishing
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          python - <<'PY'
          import pathlib, zipfile, tarfile, sys
          d = pathlib.Path('dist')
          wheels = sorted(d.glob('*.whl'))
          sdists = list(d.glob('*.tar.gz'))
          assert len(wheels) == 6 and len(sdists) == 1, (wheels, sdists)
          tags = [w.name for w in wheels]
          for platform, count in [('manylinux', 2), ('win_amd64', 2), ('macosx', 2)]:
              assert sum(platform in n for n in tags) == count, tags
          for python in ('cp312', 'cp313'):
              assert sum(python in n for n in tags) == 3, tags
          for w in wheels:
              assert w.name.startswith('limereport_pyqt6-0.1.2-'), w.name
              with zipfile.ZipFile(w) as z:
                  assert 'limereport_pyqt6/_build_qt.py' in z.namelist()
          with tarfile.open(sdists[0]) as t:
              assert any(n.endswith('/scripts/apply_lime_patch.py') for n in t.getnames())
          print('Verified six platform wheels and one sdist')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verified-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/limereport-pyqt6/0.1.2/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
